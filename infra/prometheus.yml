global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pedidos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          servico: pedidos-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
